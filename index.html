<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:          #37003c;
      --surface:     rgba(255,255,255,0.07);
      --surface-hi:  rgba(255,255,255,0.12);
      --border-dark: rgba(255,255,255,0.10);
      --border-light:#e5e7eb;
      --green:       #00ff85;
      --green-bg:    rgba(0,255,133,0.13);
      --red:         #e90052;
      --gold:        #ffd700;
      --light-card:  #ffffff;
      --light-text:  #1e1b2e;
      --light-muted: #6b7280;
      --dark-muted:  rgba(255,255,255,0.50);
      --radius:      8px;
      --radius-lg:   12px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:#fff;min-height:100vh;padding-bottom:56px;font-size:14px}
    .page{max-width:480px;margin:0 auto}

    /* Hero */
    .hero{background:linear-gradient(140deg,#00d4ff 0%,#8b2be2 45%,#37003c 100%);padding:36px 20px 28px;position:relative;overflow:hidden}
    .hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,transparent 60%,#37003c 100%);pointer-events:none}
    .hero__eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:rgba(255,255,255,0.65);margin-bottom:8px}
    .hero__title{font-size:32px;font-weight:900;line-height:1.05;letter-spacing:-0.5px}
    .hero__meta{font-size:13px;color:rgba(255,255,255,0.65);margin-top:6px}
    .hero__gw{display:inline-flex;align-items:center;gap:6px;margin-top:14px;padding:5px 14px;background:rgba(0,0,0,0.20);border:1px solid rgba(255,255,255,0.55);border-radius:20px;font-size:12px;font-weight:700;color:#fff;letter-spacing:0.3px}
    .live-dot{width:6px;height:6px;background:#fff;border-radius:50%;animation:blink 1.6s ease-in-out infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

    /* Loading */
    .loading-state{display:flex;flex-direction:column;align-items:center;padding:64px 20px;gap:14px}
    .spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,0.12);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading-text{font-size:13px;font-weight:600;color:var(--dark-muted)}
    .error-state{padding:48px 20px;text-align:center}
    .error-state p{color:var(--red);font-size:13px;font-weight:700;margin-bottom:14px}
    .retry-btn{background:var(--surface);border:1px solid var(--border-dark);color:#fff;padding:9px 22px;border-radius:20px;font-family:inherit;font-size:13px;font-weight:800;cursor:pointer}

    /* MOTM card */
    .motm{background:var(--surface);border:1px solid rgba(255,215,0,0.22);border-left:3px solid var(--gold);border-radius:var(--radius-lg);padding:16px 18px;display:flex;align-items:center;gap:14px}
    .motm__crown{width:40px;height:40px;background:rgba(255,215,0,0.12);border:1px solid rgba(255,215,0,0.30);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
    .motm__label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--gold)}
    .motm__name{font-size:16px;font-weight:900;margin:2px 0 1px;letter-spacing:-0.3px}
    .motm__sub{font-size:12px;color:rgba(255,255,255,0.55)}

    /* Sections */
    .section{padding:20px 16px 4px}
    .section__label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.2px;color:rgba(255,255,255,0.40);margin-bottom:10px}

    /* White card (standings) */
    .wcard{background:var(--light-card);border-radius:var(--radius-lg);overflow:hidden}
    .wcard__col-heads{display:flex;align-items:center;padding:12px 16px 6px;border-bottom:1px solid var(--border-light)}
    .wcard__col-head{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--light-muted)}
    .srow{display:flex;align-items:center;padding:13px 16px;border-top:1px solid var(--border-light);gap:10px}
    .srow:first-of-type{border-top:none}
    .srow__rank{font-size:15px;font-weight:900;width:22px;color:var(--light-text);flex-shrink:0}
    .srow__indicator{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;flex-shrink:0}
    .srow__indicator--up{background:var(--green);color:#000}
    .srow__indicator--down{background:var(--red);color:#fff}
    .srow__indicator--same{background:#e5e7eb;color:#9ca3af}
    .srow__team{flex:1;min-width:0}
    .srow__name{font-size:14px;font-weight:800;color:var(--light-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .srow__mgr{font-size:11px;color:var(--light-muted);margin-top:1px}
    .srow__scores{display:flex;gap:18px;flex-shrink:0}
    .srow__score-col{text-align:right}
    .srow__val{font-size:15px;font-weight:900;color:var(--light-text);display:block}
    .srow__val--total{font-size:16px}
    .srow__col-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--light-muted);display:block}

    /* Dark card */
    .dcard{background:var(--surface);border:1px solid var(--border-dark);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:8px}
    .dcard__head{padding:14px 16px 0;font-size:13px;font-weight:800;color:rgba(255,255,255,.90);letter-spacing:-.2px}

    /* Score bars */
    .score-bars{padding:16px;display:flex;align-items:flex-end;gap:5px;height:100px}
    .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%}
    .bar-col__val{font-size:11px;font-weight:800;color:rgba(255,255,255,.80)}
    .bar-col__val--hi{color:var(--green)}
    .bar-col__val--lo{color:var(--red)}
    .bar-col__bar{width:100%;border-radius:3px 3px 0 0;background:rgba(255,255,255,.12)}
    .bar-col__bar--hi{background:var(--green)}
    .bar-col__bar--lo{background:var(--red);opacity:.6}
    .bar-col__name{font-size:9px;font-weight:700;color:rgba(255,255,255,.40);text-align:center}

    /* List rows (dark cards) */
    .drow{display:flex;align-items:center;padding:11px 16px;border-top:1px solid var(--border-dark);gap:10px}
    .drow:first-of-type{border-top:none}
    .drow__info{flex:1;min-width:0}
    .drow__name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .drow__sub{font-size:11px;color:var(--dark-muted);margin-top:2px}

    /* Captain badge */
    .cbadge{display:inline-block;background:rgba(255,215,0,.15);color:var(--gold);border-radius:4px;font-size:10px;font-weight:800;padding:2px 6px;margin-left:6px}

    /* Captain pts */
    .cap-pts{text-align:right;flex-shrink:0}
    .cap-pts__val{font-size:17px;font-weight:900;display:block}
    .cap-pts__val--great{color:var(--green)}
    .cap-pts__val--ok{color:#fbbf24}
    .cap-pts__val--bad{color:var(--red)}
    .cap-pts__label{font-size:10px;color:var(--dark-muted);display:block;margin-top:2px}

    /* Ownership bar */
    .own-wrap{flex:1;padding:0 6px}
    .own-bg{height:4px;background:rgba(255,255,255,.10);border-radius:2px;overflow:hidden}
    .own-fill{height:100%;background:var(--green);border-radius:2px}
    .own-label{font-size:11px;font-weight:800;color:var(--green);min-width:32px;text-align:right;flex-shrink:0}

    /* Club badge */
    .cicon{width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
    .cicon img{width:36px;height:36px;object-fit:contain}
    .ccount{font-size:18px;font-weight:900;color:rgba(255,255,255,.35);flex-shrink:0}

    /* Player thumb */
    .player-thumb{width:44px;height:44px;border-radius:8px;overflow:hidden;flex-shrink:0;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.10)}
    .player-thumb img{width:100%;height:130%;object-fit:cover;object-position:top center;margin-top:-4px}

    /* Transfer dots */
    .xdots{display:flex;gap:4px;align-items:center;flex-shrink:0}
    .xdot{width:8px;height:8px;border-radius:50%;background:var(--green)}
    .xdot--e{background:none;border:1px solid rgba(255,255,255,.15)}
    .xnum{font-size:12px;font-weight:800;color:rgba(255,255,255,.40);margin-left:6px;min-width:12px}

    /* Records */
    .rec-grid{display:grid;grid-template-columns:1fr 1fr}
    .rec-cell{padding:18px 16px;text-align:center;border-top:1px solid var(--border-dark);border-right:1px solid var(--border-dark)}
    .rec-cell:nth-child(even){border-right:none}
    .rec-cell:nth-child(-n+2){border-top:none}
    .rec-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--dark-muted)}
    .rec-val{font-size:30px;font-weight:900;line-height:1;margin:8px 0 5px;letter-spacing:-1px}
    .rec-sub{font-size:11px;color:var(--dark-muted)}

    /* MOTD rows */
    .mrow{display:flex;align-items:center;padding:11px 16px;border-top:1px solid var(--border-dark);gap:10px}
    .mrow:first-of-type{border-top:none}
    .mrow__gw{font-size:11px;color:var(--dark-muted);font-weight:700;min-width:32px}
    .mrow__name{font-size:14px;font-weight:700;flex:1}
    .mrow__pts{font-size:14px;font-weight:900}
    .mrow__star{color:var(--gold);font-size:11px;margin-left:5px}

    /* History table */
    .hist-scroll{overflow-x:auto}
    .hist-tbl{width:100%;border-collapse:collapse;min-width:340px}
    .hist-tbl th{padding:10px 6px 6px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--dark-muted);text-align:center}
    .hist-tbl th:first-child{text-align:left;padding-left:16px}
    .hist-tbl td{padding:8px 6px;border-top:1px solid var(--border-dark);text-align:center;font-size:13px;font-weight:700;color:rgba(255,255,255,.65)}
    .hist-tbl td:first-child{text-align:left;padding-left:16px;font-size:11px;font-weight:700;color:rgba(255,255,255,.35)}
    .hist-tbl td:last-child{padding-right:16px}
    .hw{color:var(--gold)!important;font-weight:900!important}
    .hh{color:var(--green)!important;font-weight:800!important}
    .hl{color:var(--red)!important;opacity:.75}
    .hist-legend{display:flex;gap:14px;padding:10px 16px 14px}
    .hist-legend span{font-size:10px;font-weight:700;color:var(--dark-muted)}

    /* MOTD wins */
    .wins-bar{flex:1;padding:0 10px}
    .wins-bg{height:4px;background:rgba(255,255,255,.10);border-radius:2px;overflow:hidden}
    .wins-fill{height:100%;background:var(--green);border-radius:2px}
    .wins-n{font-size:13px;font-weight:800;min-width:20px;text-align:right;flex-shrink:0;color:var(--green)}
    .wins-n--zero{color:rgba(255,255,255,.25)}

    /* Footer */
    .footer{padding:24px 20px 0;text-align:center;font-size:11px;color:rgba(255,255,255,.20);line-height:2}
    .footer-row{display:flex;align-items:center;justify-content:center;gap:12px}
    .last-updated{font-size:11px;color:rgba(255,255,255,.30);font-weight:600}
  </style>
</head>
<body>
<div class="page">

  <header>
    <div class="hero">
      <div class="hero__eyebrow">Fantasy Premier League 2025/26</div>
      <h1 class="hero__title">MCS</h1>
      <div class="hero__meta" id="hero-meta">10 managers &middot; Private classic league</div>
      <div class="hero__gw">
        <span class="live-dot"></span>
        <span id="gw-pill-text">Loading&hellip;</span>
      </div>
    </div>
  </header>

  <div id="loading-state" class="loading-state">
    <div class="spinner"></div>
    <p class="loading-text" id="loading-msg">Fetching live data&hellip;</p>
  </div>

  <div id="error-state" class="error-state" style="display:none">
    <p id="error-msg">Something went wrong.</p>
    <button class="retry-btn" onclick="init()">Try again</button>
  </div>

  <div id="app" style="display:none"></div>

  <div class="footer" id="footer" style="display:none">
    <div class="footer-row">
      <span class="last-updated" id="last-updated"></span>
      <button class="retry-btn" onclick="init()">Refresh</button>
    </div>
    <div>JDFC League &middot; Fantasy Premier League 2025/26 &middot; Data via FPL API</div>
  </div>

</div>
<script>
// ─── Config ────────────────────────────────────────────────────────
const LEAGUE_ID  = 409139;
const POS        = {1:'GK',2:'DEF',3:'MID',4:'FWD'};
const FPL_API    = 'https://fantasy.premierleague.com/api/';
const PLAYER_IMG = code => `https://resources.premierleague.com/premierleague/photos/players/110x140/p${code}.png`;
const CLUB_IMG   = code => `https://resources.premierleague.com/premierleague/badges/50/t${code}.png`;

// ─── API ────────────────────────────────────────────────────────────
// Race all proxies in parallel — first successful response wins
async function apiFetch(path, timeoutMs = 18000) {
  const url = FPL_API + path;

  // Direct fetch works when page is served over HTTP (GitHub Pages etc.)
  const targets = [
    url,
    `https://corsproxy.io/?${encodeURIComponent(url)}`,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
    `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
    `https://thingproxy.freeboard.io/fetch/${url}`,
  ];

  return new Promise((resolve, reject) => {
    let done = false, failures = 0;
    targets.forEach(target => {
      const ac = new AbortController();
      const tid = setTimeout(() => ac.abort(), timeoutMs);
      fetch(target, {signal: ac.signal})
        .then(r => { clearTimeout(tid); if (r.ok) return r.json(); throw new Error(`${r.status}`); })
        .then(data => { if (!done) { done = true; resolve(data); } })
        .catch(() => {
          clearTimeout(tid);
          if (++failures === targets.length && !done)
            reject(new Error(`All proxies failed. Try opening on a different network, or host on GitHub Pages.`));
        });
    });
  });
}

// Bootstrap cached in localStorage for 6 h to avoid re-fetching the large file
async function fetchBootstrap() {
  const KEY = 'fpl_bs_cache', TTL = 6 * 3600 * 1000;
  try {
    const cached = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (cached && (Date.now() - cached.ts) < TTL) return cached.data;
  } catch {}
  setMsg('Fetching player data (large file — one moment)…');
  const data = await apiFetch('bootstrap-static/', 30000);
  try { localStorage.setItem(KEY, JSON.stringify({data, ts: Date.now()})); } catch {}
  return data;
}

// ─── Helpers ────────────────────────────────────────────────────────
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function buildPlayerMap(elements) {
  const m = {};
  elements.forEach(p => { m[p.id] = {name:p.web_name, code:p.code, teamId:p.team, pos:POS[p.element_type]||'?'}; });
  return m;
}
function buildTeamMap(teams) {
  const m = {};
  teams.forEach(t => { m[t.id] = {name:t.name, short:t.short_name, code:t.code}; });
  return m;
}

function getMostOwned(allPicks, playerMap, teamMap, limit=8) {
  const cnt = {};
  allPicks.forEach(({picks}) => picks.forEach(p => { cnt[p.element] = (cnt[p.element]||0)+1; }));
  return Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([id,c]) => {
    const p = playerMap[id]||{};
    const t = teamMap[p.teamId]||{};
    return {id:+id, name:p.name||'?', code:p.code, club:t.short||'?', pos:p.pos||'?', count:c, of:allPicks.length};
  });
}

function getCaptains(allPicks, managers, playerMap, teamMap, liveMap) {
  const caps = {};
  allPicks.forEach(({picks}, i) => {
    const c = picks.find(p => p.is_captain);
    if (!c) return;
    if (!caps[c.element]) caps[c.element] = {element:c.element, managers:[], mult:c.multiplier||2};
    caps[c.element].managers.push(managers[i].player_name.split(' ')[0]);
  });
  return Object.values(caps).sort((a,b)=>b.managers.length-a.managers.length).map(c => {
    const p = playerMap[c.element]||{};
    const t = teamMap[p.teamId]||{};
    const base = (liveMap[c.element]?.stats?.total_points)??0;
    return {...c, name:p.name||'?', code:p.code, club:t.short||'?', base, capPts:base*c.mult};
  });
}

function getMostPopularClubs(allPicks, playerMap, teamMap, limit=5) {
  const cnt={}, names={};
  allPicks.forEach(({picks}) => picks.forEach(p => {
    const pl=playerMap[p.element]; if(!pl) return;
    cnt[pl.teamId]=(cnt[pl.teamId]||0)+1;
    (names[pl.teamId]=names[pl.teamId]||new Set()).add(pl.name);
  }));
  return Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([tid,c])=>{
    const t=teamMap[+tid]||{};
    return {name:t.name||'?', code:t.code, count:c, players:[...names[+tid]].slice(0,3).join(' · ')};
  });
}

function getRecords(managers, allHistory) {
  let hi={pts:0,name:'',gw:0}, lo={pts:9999,name:'',gw:0};
  const gwPts={};
  managers.forEach((mgr,i)=>{
    (allHistory[i]?.current||[]).forEach(g=>{
      const pts=g.points-(g.event_transfers_cost||0);
      if(pts>hi.pts) hi={pts,name:mgr.player_name.split(' ')[0],gw:g.event};
      if(pts<lo.pts) lo={pts,name:mgr.player_name.split(' ')[0],gw:g.event};
      (gwPts[g.event]=gwPts[g.event]||[]).push(pts);
    });
  });
  const avgs=Object.entries(gwPts).map(([gw,pts])=>({gw:+gw,avg:+(pts.reduce((a,b)=>a+b,0)/pts.length).toFixed(1)}));
  avgs.sort((a,b)=>b.avg-a.avg);
  return {hi, lo, bestGW:avgs[0], worstGW:avgs[avgs.length-1]};
}

function getMOTDHistory(managers, allHistory) {
  const win={};
  managers.forEach((mgr,i)=>{
    (allHistory[i]?.current||[]).forEach(g=>{
      const pts=g.points-(g.event_transfers_cost||0);
      if(!win[g.event]||pts>win[g.event].pts) win[g.event]={pts,name:mgr.player_name.split(' ')[0]};
    });
  });
  return Object.entries(win).sort((a,b)=>+a[0]-+b[0]).map(([gw,d])=>({gw:+gw,...d}));
}

function getMOTDWins(managers, allHistory) {
  const wins={};
  managers.forEach(m=>{wins[m.player_name.split(' ')[0]]=0;});
  getMOTDHistory(managers,allHistory).forEach(({name})=>{if(name in wins) wins[name]++;});
  const maxW=Math.max(...Object.values(wins),1);
  return Object.entries(wins).sort((a,b)=>b[1]-a[1]).map(([n,w])=>({name:n,wins:w,pct:Math.round(w/maxW*100)}));
}

// ─── Render helpers ─────────────────────────────────────────────────
function xferDots(n, max=3) {
  let h='';
  for(let i=0;i<max;i++) h+=`<span class="xdot${i<n?'':' xdot--e'}"></span>`;
  return h+`<span class="xnum">${n}</span>`;
}

function playerThumb(code, name) {
  if (!code) return `<div class="player-thumb"></div>`;
  return `<div class="player-thumb"><img src="${PLAYER_IMG(code)}" alt="${esc(name)}" loading="lazy"></div>`;
}

function capColor(base) {
  if (base >= 12) return 'great';
  if (base >= 6)  return 'ok';
  return 'bad';
}

// ─── Section renderers ──────────────────────────────────────────────
function renderMOTM(winner, gw) {
  return `
  <div class="section" style="padding-bottom:0">
    <div class="motm">
      <div class="motm__crown">&#9733;</div>
      <div>
        <div class="motm__label">Manager of the matchday</div>
        <div class="motm__name">${esc(winner.name)} &mdash; ${winner.pts} pts</div>
        <div class="motm__sub">${esc(winner.team)} &middot; GW${gw}</div>
      </div>
    </div>
  </div>`;
}

function renderStandings(managers, gw) {
  const rows = managers.map(m => {
    const dir = m.rank < m.last_rank ? 'up' : m.rank > m.last_rank ? 'down' : 'same';
    const arrow = dir==='up' ? '&#9650;' : dir==='down' ? '&#9660;' : '&mdash;';
    return `
    <div class="srow">
      <div class="srow__rank">${m.rank}</div>
      <div class="srow__indicator srow__indicator--${dir}">${arrow}</div>
      <div class="srow__team">
        <div class="srow__name">${esc(m.entry_name)}</div>
        <div class="srow__mgr">${esc(m.player_name.split(' ')[0])}</div>
      </div>
      <div class="srow__scores">
        <div class="srow__score-col">
          <span class="srow__col-label">GW${gw}</span>
          <span class="srow__val">${m.event_total}</span>
        </div>
        <div class="srow__score-col">
          <span class="srow__col-label">Total</span>
          <span class="srow__val srow__val--total">${m.total}</span>
        </div>
      </div>
    </div>`;
  }).join('');
  return `
  <div class="section">
    <div class="section__label">Standings</div>
    <div class="wcard">
      <div class="wcard__col-heads">
        <div class="wcard__col-head" style="flex:1">Team</div>
        <div class="wcard__col-head" style="min-width:90px;text-align:right">GW${gw} &nbsp; Total</div>
      </div>
      ${rows}
    </div>
  </div>`;
}

function renderScoreBars(managers, gw) {
  const sorted = [...managers].sort((a,b) => b.event_total - a.event_total);
  const maxPts = sorted[0]?.event_total || 1;
  const minPts = sorted[sorted.length-1]?.event_total;
  const cols = sorted.map(m => {
    const pts = m.event_total;
    const h = Math.max(Math.round((pts/maxPts)*68), 4);
    const hi = pts===maxPts, lo = pts===minPts && pts!==maxPts;
    return `
    <div class="bar-col">
      <span class="bar-col__val${hi?' bar-col__val--hi':lo?' bar-col__val--lo':''}">${pts}</span>
      <div class="bar-col__bar${hi?' bar-col__bar--hi':lo?' bar-col__bar--lo':''}" style="height:${h}px"></div>
      <span class="bar-col__name">${esc(m.player_name.split(' ')[0])}</span>
    </div>`;
  }).join('');
  return `
  <div class="dcard">
    <div class="dcard__head" style="padding-bottom:2px">GW${gw} scores</div>
    <div class="score-bars">${cols}</div>
  </div>`;
}

function renderCaptains(captains, total) {
  const rows = captains.map(c => `
  <div class="drow">
    ${playerThumb(c.code, c.name)}
    <div class="drow__info">
      <div class="drow__name">${esc(c.name)} <span class="cbadge">C &times; ${c.managers.length}</span></div>
      <div class="drow__sub">${esc(c.club)} &middot; ${esc(c.managers.join(', '))}</div>
    </div>
    <div class="cap-pts">
      <span class="cap-pts__val cap-pts__val--${capColor(c.base)}">${c.capPts} pts</span>
      <span class="cap-pts__label">${Math.round(c.managers.length/total*100)}% of league</span>
    </div>
  </div>`).join('');
  return `
  <div class="dcard">
    <div class="dcard__head" style="padding-bottom:10px">Captain picks</div>
    ${rows}
  </div>`;
}

function renderMostOwned(owned) {
  const rows = owned.map(p => `
  <div class="drow">
    ${playerThumb(p.code, p.name)}
    <div class="drow__info">
      <div class="drow__name">${esc(p.name)}</div>
      <div class="drow__sub">${esc(p.club)} &middot; ${p.pos}</div>
    </div>
    <div class="own-wrap"><div class="own-bg"><div class="own-fill" style="width:${Math.round(p.count/p.of*100)}%"></div></div></div>
    <div class="own-label">${p.count}/${p.of}</div>
  </div>`).join('');
  return `
  <div class="dcard">
    <div class="dcard__head" style="padding-bottom:10px">Most owned</div>
    ${rows}
  </div>`;
}

function renderClubs(clubs) {
  const rows = clubs.map(c => `
  <div class="drow">
    <div class="cicon"><img src="${CLUB_IMG(c.code)}" alt="${esc(c.name)}" loading="lazy"></div>
    <div class="drow__info">
      <div class="drow__name">${esc(c.name)}</div>
      <div class="drow__sub">${esc(c.players)}</div>
    </div>
    <div class="ccount">${c.count}</div>
  </div>`).join('');
  return `
  <div class="dcard">
    <div class="dcard__head" style="padding-bottom:10px">Most popular clubs</div>
    ${rows}
  </div>`;
}

function renderTransfers(managers, allHistory, gw) {
  const xfers = managers.map((m,i) => {
    const hist = allHistory[i]?.current||[];
    const entry = hist.find(h=>h.event===gw);
    return {name:m.player_name.split(' ')[0], team:m.entry_name, n:entry?.event_transfers||0};
  }).sort((a,b)=>b.n-a.n);
  const rows = xfers.map(x=>`
  <div class="drow">
    <div class="drow__info">
      <div class="drow__name">${esc(x.name)}</div>
      <div class="drow__sub">${esc(x.team)}</div>
    </div>
    <div class="xdots">${xferDots(x.n)}</div>
  </div>`).join('');
  return `
  <div class="dcard">
    <div class="dcard__head" style="padding-bottom:10px">GW${gw} transfers</div>
    ${rows}
  </div>`;
}

function renderRecords(records) {
  return `
  <div class="dcard">
    <div class="dcard__head" style="padding-bottom:4px">Matchday records</div>
    <div class="rec-grid">
      <div class="rec-cell">
        <div class="rec-label">Highest ever</div>
        <div class="rec-val" style="color:var(--gold)">${records.hi.pts}</div>
        <div class="rec-sub">${esc(records.hi.name)} &middot; GW${records.hi.gw}</div>
      </div>
      <div class="rec-cell">
        <div class="rec-label">Lowest ever</div>
        <div class="rec-val" style="color:var(--red)">${records.lo.pts}</div>
        <div class="rec-sub">${esc(records.lo.name)} &middot; GW${records.lo.gw}</div>
      </div>
      <div class="rec-cell">
        <div class="rec-label">Best GW avg</div>
        <div class="rec-val" style="color:var(--green)">${records.bestGW?.avg??'–'}</div>
        <div class="rec-sub">GW${records.bestGW?.gw??'–'}</div>
      </div>
      <div class="rec-cell">
        <div class="rec-label">Worst GW avg</div>
        <div class="rec-val" style="color:rgba(255,255,255,0.40)">${records.worstGW?.avg??'–'}</div>
        <div class="rec-sub">GW${records.worstGW?.gw??'–'}</div>
      </div>
    </div>
  </div>`;
}

function renderMOTDHistory(motdHistory) {
  const rows = motdHistory.map(({gw,name,pts}) => `
  <div class="mrow">
    <div class="mrow__gw">GW${gw}</div>
    <div class="mrow__name">${esc(name)}</div>
    <div class="mrow__pts">${pts}</div>
  </div>`).join('');
  return `
  <div class="dcard">
    <div class="dcard__head" style="padding-bottom:10px">Manager of the matchday</div>
    ${rows}
  </div>`;
}

function renderMOTDWins(motdWins) {
  const rows = motdWins.map(({name,wins,pct}) => `
  <div class="drow">
    <div class="drow__info"><div class="drow__name" style="${wins===0?'color:rgba(255,255,255,0.40)':''}">${esc(name)}</div></div>
    <div class="wins-bar"><div class="wins-bg"><div class="wins-fill" style="width:${pct}%"></div></div></div>
    <div class="wins-n${wins===0?' wins-n--zero':''}">${wins}</div>
  </div>`).join('');
  return `
  <div class="dcard">
    <div class="dcard__head" style="padding-bottom:10px">MOTD wins</div>
    ${rows}
  </div>`;
}

function renderHistoryTable(managers, allHistory) {
  const gwData = {};
  managers.forEach((mgr,i) => {
    (allHistory[i]?.current||[]).forEach(g => {
      (gwData[g.event]=gwData[g.event]||{})[i] = g.points-(g.event_transfers_cost||0);
    });
  });
  const gws = Object.keys(gwData).sort((a,b)=>+a-+b);
  const heads = managers.map(m=>`<th>${esc(m.player_name.split(' ')[0].slice(0,5))}</th>`).join('');
  const rows = gws.map(gw => {
    const d=gwData[gw];
    const pts=managers.map((_,i)=>d[i]??null);
    const valid=pts.filter(p=>p!==null);
    const mx=Math.max(...valid), mn=Math.min(...valid);
    const cells=pts.map(p => {
      if(p===null) return '<td>-</td>';
      const c=p===mx?'hw':p===mn?'hl':'';
      return `<td class="${c}">${p}</td>`;
    }).join('');
    return `<tr><td>GW${gw}</td>${cells}</tr>`;
  }).join('');
  return `
  <div class="dcard">
    <div class="dcard__head" style="padding-bottom:10px">Points by gameweek</div>
    <div class="hist-scroll">
      <table class="hist-tbl">
        <thead><tr><th></th>${heads}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="hist-legend">
      <span style="color:var(--gold)">&#9646; GW high</span>
      <span style="color:var(--red)">&#9646; GW low</span>
    </div>
  </div>`;
}

function setMsg(msg) { document.getElementById('loading-msg').textContent = msg; }
function showEl(id, show=true) { document.getElementById(id).style.display = show?'':'none'; }

function renderAll({ currentGW, managers, allPicks, allHistory, liveMap, playerMap, teamMap, gwEvent }) {
  const motdHistory = getMOTDHistory(managers, allHistory);
  const motmGW      = motdHistory[motdHistory.length-1];
  const motmMgr     = managers.find(m=>m.player_name.split(' ')[0]===motmGW?.name);
  const captains    = getCaptains(allPicks, managers, playerMap, teamMap, liveMap);
  const mostOwned   = getMostOwned(allPicks, playerMap, teamMap);
  const clubs       = getMostPopularClubs(allPicks, playerMap, teamMap);
  const records     = getRecords(managers, allHistory);
  const motdWins    = getMOTDWins(managers, allHistory);

  document.getElementById('gw-pill-text').textContent = `Gameweek ${currentGW}`;
  const heroMeta = document.getElementById('hero-meta');
  if (heroMeta) heroMeta.textContent = `${managers.length} managers · Private classic league`;
  document.getElementById('app').innerHTML = `
    ${renderMOTM({name:motmGW?.name||'–', pts:motmGW?.pts||0, team:motmMgr?.entry_name||'–'}, currentGW)}
    ${renderStandings(managers, currentGW)}
    <div class="section">
      <div class="section__label">GW${currentGW} stats</div>
      ${renderScoreBars(managers, currentGW)}
      ${renderCaptains(captains, allPicks.length)}
      ${renderMostOwned(mostOwned)}
      ${renderClubs(clubs)}
      ${renderTransfers(managers, allHistory, currentGW)}
    </div>
    <div class="section">
      <div class="section__label">Overall stats</div>
      ${renderRecords(records)}
      ${renderMOTDHistory(motdHistory)}
      ${renderMOTDWins(motdWins)}
      ${renderHistoryTable(managers, allHistory)}
    </div>
  `;
  document.getElementById('last-updated').textContent =
    'Updated ' + new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  showEl('loading-state', false);
  showEl('app');
  showEl('footer');

  if (!PRELOADED_DATA && gwEvent && !gwEvent.finished)
    setTimeout(init, 5 * 60 * 1000);
}

async function init() {
  showEl('loading-state'); showEl('app',false); showEl('error-state',false); showEl('footer',false);

  // Fast path: Python script has pre-baked the data directly into this file
  if (PRELOADED_DATA) {
    const { currentGW, managers, allPicks, allHistory, liveElements, elements, teams } = PRELOADED_DATA;
    const playerMap = buildPlayerMap(elements);
    const teamMap   = buildTeamMap(teams);
    const liveMap   = {};
    (liveElements||[]).forEach(e => { liveMap[e.id] = e; });
    renderAll({ currentGW, managers, allPicks, allHistory, liveMap, playerMap, teamMap, gwEvent: null });
    return;
  }

  // Live path: fetch from FPL API via CORS proxies
  try {
    setMsg('Fetching league standings…');
    const [bootstrap, leagueData] = await Promise.all([
      fetchBootstrap(),
      apiFetch(`leagues-classic/${LEAGUE_ID}/standings/`)
    ]);

    const playerMap = buildPlayerMap(bootstrap.elements);
    const teamMap   = buildTeamMap(bootstrap.teams);
    const managers  = leagueData.standings.results;

    const currentGW = bootstrap.events.find(e=>e.is_current)?.id
                   || (bootstrap.events.find(e=>e.is_next)?.id - 1)
                   || 1;
    const gwEvent = bootstrap.events.find(e=>e.id===currentGW);

    setMsg('Fetching live scores and picks…');
    const entryIds = managers.map(m=>m.entry);
    const [liveData, ...rest] = await Promise.all([
      apiFetch(`event/${currentGW}/live/`),
      ...entryIds.map(id => apiFetch(`entry/${id}/event/${currentGW}/picks/`)),
      ...entryIds.map(id => apiFetch(`entry/${id}/history/`))
    ]);

    const allPicks   = rest.slice(0, entryIds.length);
    const allHistory = rest.slice(entryIds.length);
    const liveMap    = {};
    liveData.elements.forEach(e => { liveMap[e.id] = e; });

    renderAll({ currentGW, managers, allPicks, allHistory, liveMap, playerMap, teamMap, gwEvent });

  } catch(err) {
    showEl('loading-state', false);
    document.getElementById('error-msg').textContent = err.message || 'Failed to load data. Check your connection.';
    showEl('error-state');
  }
}

init();
</script>

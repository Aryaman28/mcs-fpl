name: Update MCS League

on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run updater
        run: python mcs_update.py

      - name: Commit & push if data changed
        run: |
          git config user.name  "MCS Bot"
          git config user.email "mcs-bot@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "GW update $(date -u +%Y-%m-%d)"
          git push
